    <style>
        :root {
            --bg: #f5f3ef;
            --grid: #e0d9cf;
            --ink: #1d1b19;
            --muted: #5d564f;
            --accent: #f2c100;
            --accent-strong: #c79400;
            --accent-rgb: 242, 193, 0;
            --card: #fcfbf8;
            --border: #1d1b19;
            --border-soft: #c8c1b7;
            --shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
            --shadow-soft: 0 6px 14px rgba(0, 0, 0, 0.06);
            --border-width: 1px;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Space Grotesk", sans-serif;
            color: var(--ink);
            background-color: var(--bg);
            background-image:
                linear-gradient(var(--grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 140px 140px;
            padding: 24px 18px 60px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            top: 50%;
            left: 50%;
            width: 40vmax;
            height: 40vmax;
            transform: translate(-50%, -50%) scale(0.05);
            background: radial-gradient(
                circle,
                rgba(255, 255, 255, 0.95) 0%,
                rgba(var(--accent-rgb), 0.9) 10%,
                rgba(var(--accent-rgb), 0) 70%
            );
            border-radius: 50%;
            animation: pulseGlow 15s infinite ease-in-out;
            pointer-events: none;
            z-index: -1;
        }
        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.05); opacity: 1; }
            60% { opacity: 0.85; }
            100% { transform: translate(-50%, -50%) scale(5); opacity: 0; }
        }
        a {
            color: inherit;
            text-decoration: none;
        }
        button,
        input,
        select {
            font-family: inherit;
        }
        .page {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .page-header {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 40px 20px 20px; /* Increased top padding */
            background: transparent;
            border: none;
            box-shadow: none;
        }
        .header-left {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px; /* Increased gap */
        }
        .header-right {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        /* Mobile adjust for header */
        @media (max-width: 640px) {
            .page-header {
                flex-direction: column;
                gap: 16px;
                padding-top: 24px;
            }
            .header-left {
                position: relative;
                left: auto;
                top: auto;
                transform: none;
                align-items: center;
                order: 2;
                margin-bottom: 0;
            }
            .header-right {
                position: relative;
                right: auto;
                top: auto;
                transform: none;
                order: 3;
            }
            h1 { order: 1; }
        }
        .lang-toggle {
            display: inline-flex;
            gap: 8px; /* Spacing between buttons */
            background: rgba(255,255,255,0.6);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-soft);
        }
        .lang-btn {
            background: none;
            border: none;
            font-size: 0.85rem; /* Larger font */
            font-weight: 700;   /* Bolder */

            cursor: pointer;
            padding: 2px 4px;
            text-transform: uppercase;
            transition: color 0.2s;
        }
        .lang-btn.is-active {
            color: var(--ink);
            text-decoration: underline;
            text-underline-offset: 4px;
        }
        .site-credit {
            font-size: 0.7rem;
            letter-spacing: 0.04em;
            color: var(--muted);

            padding: 6px 10px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            cursor: pointer;
        }
        .install-btn:hover {
            background: var(--bg);
        }
        .ig-link svg {
            width: 22px;
            height: 22px;
        }
        .ios-install-hint {

            align-items: center;
            justify-content: space-between;

            border: var(--border-width) solid var(--border);
            background: #fff;
            box-shadow: var(--shadow-soft);
            padding: 10px 14px;
            font-size: 0.85rem;

        .ios-install-close {

            background: none;
            cursor: pointer;
            font-size: 1.1rem;
            line-height: 1;
            color: var(--muted);
            padding: 4px;

        .ig-link:hover {
            text-decoration: underline;
        }

            font-size: clamp(1.8rem, 1.4rem + 1.2vw, 2.5rem);
            text-transform: uppercase;
            letter-spacing: 0.16em;
            font-weight: 700;
            line-height: 1.1;
        }
        /* --- NEW TABS --- */
        .view-tabs {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-soft);
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 12px 16px;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
            color: var(--muted);
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
        }
        .tab-btn::after {
            content: "";
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--accent);
            opacity: 0;
            transition: opacity 0.2s;

        .tab-btn.is-active {
            color: var(--ink);

        .tab-btn.is-active::after {
            opacity: 1;
        }
        .controls-section {
            background: var(--card);
            border: var(--border-width) solid var(--border);
            box-shadow: var(--shadow-soft);
            padding: 12px;
            margin-bottom: 18px;

        .primary-controls {
            display: grid;
            grid-template-columns: minmax(240px, 1fr) minmax(150px, 0.34fr) minmax(280px, 0.62fr);
            gap: 10px;
            align-items: start;

        .date-wrapper,
        .sort-wrapper {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .sort-controls {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 8px;
            align-items: stretch;

            border: var(--border-width) solid var(--border);

            color: var(--ink);

            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;

            padding: 0 12px;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .near-me-btn:hover,
        .near-me-btn.is-active {
            background: var(--accent);
        }
        .filters-toggle {
            display: none;
            width: 100%;
            margin-top: 12px;
            min-height: 40px;
            border: var(--border-width) solid var(--border);
            background: #fff;
            color: var(--ink);
            cursor: pointer;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            line-height: 1;
            padding: 10px 12px;
            text-transform: uppercase;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .filters-toggle::after {
            content: "+";
            font-size: 1rem;
        }
        .filters-toggle.is-active::after {
            content: "–";
        }
        .advanced-filters {
            display: block;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-soft);
            animation: none;
        }
        .advanced-filters.is-expanded {
            display: block;
        }
        .advanced-grid {
            display: grid;
            grid-template-columns: minmax(220px, 1.1fr) minmax(150px, 0.8fr) minmax(150px, 0.8fr) auto;
            gap: 10px;
            align-items: start;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .content-checkboxes {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }
        .checkbox-option {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 42px;
            padding: 0 10px;
            background: #fff;
            border: var(--border-width) solid var(--border-soft);
        }
        .checkbox-option input {
            accent-color: var(--accent-strong);
            margin: 0;
        }
        .checkbox-option label {
            cursor: pointer;
            line-height: 1.2;
            text-transform: none;
            letter-spacing: 0;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--ink);
        }
        .clear-btn-wrapper {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            min-height: 42px;
        }
        label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--muted);
            font-weight: 700;
        }
        input[type="search"],
        select {
            height: 42px;
            padding: 0 12px;
            border: var(--border-width) solid var(--border-soft);
            background: #fff;
            width: 100%;
            font-size: 0.9rem;
        }
        input[type="search"]:focus,
        select:focus {
            outline: 2px solid var(--accent);
            border-color: var(--accent);
        }
        .link-btn {
            min-height: 42px;
            border: var(--border-width) solid var(--border);
            background: #fff;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.7rem;
            cursor: pointer;
            color: var(--ink);
            padding: 8px 12px;
        }
        .link-btn:hover {
            background: var(--bg);
        }
        .location-status {
            font-size: 0.72rem;
            color: var(--muted);
            min-height: 1em;
            margin-top: 4px;
        }
        .distance-label {
            color: var(--muted);
            font-size: 0.78em;
            font-weight: 500;
            margin-left: 6px;
            white-space: nowrap;
        }
        .showtime-details {
            width: 100%;
        }
        .showtime-details summary {
            cursor: pointer;
            color: var(--accent-strong);
            font-size: 0.78rem;
            font-weight: 700;
            padding: 6px 0;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .showtime-details-row {
            margin-top: 6px;
        }

        .view-section {
            border: var(--border-width) solid var(--border);
            background: var(--card);
            padding: 18px 20px;
            box-shadow: var(--shadow-soft);
        }
        .is-hidden {
            display: none;
        }
        .region-block {
            padding: 16px 0;
            border-top: var(--border-width) solid var(--border-soft);
        }
        .region-block:first-child {
            border-top: none;
            padding-top: 0;
        }
        .region-title {
            margin: 0 0 12px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }
        .cinema-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }
        .cinema-card {
            border: var(--border-width) solid var(--border);
            background: #fff;
            padding: 14px;
            text-align: left;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: var(--shadow-soft);
        }
        .cinema-card-title {
            font-weight: 600;
        }
        .cinema-card-meta {
            font-size: 0.8rem;
            color: var(--muted);
        }
        .cinema-showtimes-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            border-bottom: var(--border-width) solid var(--border-soft);
            padding-bottom: 12px;
            margin-bottom: 12px;
        }
        .back-btn {
            border: var(--border-width) solid var(--border);
            background: #fff;
            padding: 8px 12px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
        }
        .cinema-title {
            margin: 0;
            font-size: 1.4rem;
        }
        .cinema-title-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .cinema-meta {
            color: var(--muted);
            font-size: 0.85rem;
        }
        .date-block {
            padding: 14px 0;
            border-top: var(--border-width) solid var(--border-soft);
        }
        .date-block:first-child {
            border-top: none;
            padding-top: 0;
        }
        .date-title {
            margin: 0 0 12px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            font-weight: 600;
            color: var(--accent-strong);
            padding-bottom: 6px;
            border-bottom: 2px solid var(--accent);
        }
        .cinema-film {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
            gap: 12px;
            padding: 12px 0;
            border-top: var(--border-width) solid var(--border-soft);
        }
        .cinema-film:first-child {
            border-top: none;
            padding-top: 0;
        }
        .cinema-film-title {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            font-weight: 600;
        }
        .film-link {
            border: var(--border-width) solid var(--border);
            padding: 4px 8px;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            background: #fff;
        }
        .cinema-map-link {
            margin-top: 2px;
        }
        .cinema-film-meta {
            color: var(--muted);
            font-size: 0.8rem;
            margin-top: 4px;
        }
        .time-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .time-chip {
            border: var(--border-width) solid var(--border);
            padding: 6px 10px;
            font-size: 0.8rem;
            background: #fff;
        }
        .time-chip.is-bookable {
            background: #fff;
            border-color: var(--border);
            color: var(--ink);
        }
        .film-view-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            border-bottom: var(--border-width) solid var(--border-soft);
            padding-bottom: 12px;
            margin-bottom: 12px;
        }
        .results-count {
            font-weight: 600;
        }
        .results-meta {
            color: var(--muted);
            font-size: 0.85rem;
        }

            display: flex;
            flex-direction: column;
            gap: 16px;
        }

            border: var(--border-width) solid var(--border);
            background: #fff;
            padding: 16px;
            display: grid;
            grid-template-columns: 160px minmax(0, 1fr);
            gap: 16px;
            box-shadow: var(--shadow);
        }
        img.film-poster {
            display: block;
            object-fit: cover;
            height: auto;
        }

            width: 160px;
            aspect-ratio: 2 / 3;

            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.75rem;
            color: var(--muted);
            padding: 10px;
        }
        .film-body {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .film-title {
            margin: 0;
            font-size: 1.3rem;
        }
        .film-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .film-meta {
            color: var(--muted);
            font-size: 0.85rem;
        }
        .film-blurb {
            margin: 0;
            color: var(--muted);
        }

            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

            border: var(--border-width) solid var(--border-soft);
            padding: 4px 8px;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

            display: grid;
            grid-template-columns: 160px minmax(0, 1fr);
            gap: 12px;
            align-items: flex-start;
        }
        .cinema-name {
            font-weight: 600;
        }
        .cinema-name-link {
            color: inherit;
            text-decoration: underline;
            text-underline-offset: 2px;

        }
        .cinema-name-link:hover {
            color: var(--accent-strong);
        }

        }
        .page-footer {
            text-align: center;
            font-size: 0.85rem;
            color: var(--muted);
            border-top: var(--border-width) solid var(--border-soft);

                grid-template-columns: minmax(0, 1fr);
                text-align: center;

            .header-right {
                justify-content: center;
            }
            .header-left {
                align-items: center;
            }
            .primary-controls {
                grid-template-columns: minmax(0, 1fr) minmax(140px, 0.5fr);
            }
            .search-wrapper {
                grid-column: 1 / -1;
            }
            .sort-wrapper {
                grid-column: 1 / -1;
            }
            .advanced-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .content-checkboxes {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .filter-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .filter-grid-wide {
                grid-template-columns: minmax(0, 1fr);
            }
            .cinema-showtimes-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .film-card {
                grid-template-columns: minmax(0, 1fr);
            }
            .film-poster {
                width: 100%;
                max-width: 220px;
            }
            .showing-row {
                grid-template-columns: minmax(0, 1fr);
            }
            .cinema-film {
                grid-template-columns: minmax(0, 1fr);
            }
        }
        @media (max-width: 640px) {
            body {
                padding: 18px 12px 44px;
            }
            .controls-section {
                padding: 10px;
            }
            .filters-toggle {
                display: flex;
            }
            .primary-controls,
            .advanced-grid {
                grid-template-columns: minmax(0, 1fr);
            }
            .advanced-filters {
                display: none;
                margin-top: 10px;
                padding-top: 10px;
            }
            .advanced-filters.is-expanded {
                display: block;
            }
            .search-wrapper {
                grid-column: auto;
            }
            .sort-controls {
                grid-template-columns: minmax(0, 1fr);
            }
            .near-me-btn {
                width: 100%;
            }
            .filter-grid {
                grid-template-columns: minmax(0, 1fr);
            }
            .content-checkboxes {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

                letter-spacing: 0.1em;

        }
        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
            }
            body::before {
                animation: none;
                opacity: 0.25;
                transform: translate(-50%, -50%) scale(2);
            }
        }
