    <style>
        :root {
            --bg: #f5f3ef;
            --grid: #e0d9cf;
            --ink: #1d1b19;
            --muted: #5d564f;
            --accent: #f2c100;
            --accent-strong: #c79400;
            --accent-rgb: 242, 193, 0;
            --card: #fcfbf8;
            --border: #1d1b19;
            --border-soft: #c8c1b7;
            --shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
            --shadow-soft: 0 6px 14px rgba(0, 0, 0, 0.06);
            --border-width: 1px;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Space Grotesk", sans-serif;
            color: var(--ink);
            background-color: var(--bg);
            background-image:
                linear-gradient(var(--grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 140px 140px;
            padding: 24px 18px 60px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            top: 50%;
            left: 50%;
            width: 40vmax;
            height: 40vmax;
            transform: translate(-50%, -50%) scale(0.05);
            background: radial-gradient(
                circle,
                rgba(255, 255, 255, 0.95) 0%,
                rgba(var(--accent-rgb), 0.9) 10%,
                rgba(var(--accent-rgb), 0) 70%
            );
            border-radius: 50%;
            animation: pulseGlow 15s infinite ease-in-out;
            pointer-events: none;
            z-index: -1;
        }
        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.05); opacity: 1; }
            60% { opacity: 0.85; }
            100% { transform: translate(-50%, -50%) scale(5); opacity: 0; }
        }
        a {
            color: inherit;
            text-decoration: none;
        }
        button,
        input,
        select {
            font-family: inherit;
        }
        .page {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .page-header {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 40px 20px 20px; /* Increased top padding */
            background: transparent;
            border: none;
            box-shadow: none;
        }
        .header-left {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px; /* Increased gap */
        }
        .header-right {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        /* Mobile adjust for header */

                gap: 16px;
                padding-top: 24px;
            }
            .header-left {
                position: relative;
                left: auto;
                top: auto;
                transform: none;
                align-items: center;
                order: 2;
                margin-bottom: 0;
            }
            .header-right {
                position: relative;
                right: auto;
                top: auto;
                transform: none;
                order: 3;
            }
            h1 { order: 1; }
        }
        .lang-toggle {
            display: inline-flex;
            gap: 8px; /* Spacing between buttons */
            background: rgba(255,255,255,0.6);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-soft);
        }
        .lang-btn {
            background: none;
            border: none;
            font-size: 0.85rem; /* Larger font */
            font-weight: 700;   /* Bolder */

            padding: 2px 4px;
            text-transform: uppercase;
            transition: color 0.2s;

        .lang-btn.is-active {

            text-decoration: underline;
            text-underline-offset: 4px;

        .site-credit {

            padding: 6px 10px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            cursor: pointer;

        .install-btn:hover {
            background: var(--bg);
        }
        .ig-link svg {
            width: 22px;
            height: 22px;

            justify-content: space-between;

            padding: 10px 14px;
            font-size: 0.85rem;

            line-height: 1;
            color: var(--muted);

            text-decoration: underline;
        }

            text-align: center;
            font-size: clamp(1.8rem, 1.4rem + 1.2vw, 2.5rem);
            text-transform: uppercase;
            letter-spacing: 0.16em;
            font-weight: 700;
            line-height: 1.1;
        }
        /* --- NEW TABS --- */
        .view-tabs {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-soft);
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 12px 16px;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
            color: var(--muted);
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
        }
        .tab-btn::after {
            content: "";
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--accent);
            opacity: 0;
            transition: opacity 0.2s;

        .tab-btn.is-active {
            color: var(--ink);
        }
        .tab-btn.is-active::after {
            opacity: 1;
        }

            background: var(--card);
            border: var(--border-width) solid var(--border);
            box-shadow: var(--shadow-soft);
            padding: 12px;
            margin-bottom: 18px;

            align-items: start;

        .date-wrapper,

            flex-direction: column;
            gap: 6px;

            color: var(--ink);

            font-size: 0.72rem;
            font-weight: 700;

            line-height: 1;
            padding: 0 12px;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .near-me-btn:hover,
        .near-me-btn.is-active {
            background: var(--accent);
        }
        .filters-toggle {
            display: none;
            width: 100%;
            margin-top: 12px;
            min-height: 40px;
            border: var(--border-width) solid var(--border);
            background: #fff;
            color: var(--ink);
            cursor: pointer;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            line-height: 1;
            padding: 10px 12px;
            text-transform: uppercase;
            align-items: center;
            justify-content: space-between;

        }
        .filters-toggle::after {
            content: "+";

        }
        .filters-toggle.is-active::after {
            content: "–";

            padding-top: 12px;
            border-top: 1px solid var(--border-soft);
            animation: none;
        }
        .advanced-filters.is-expanded {
            display: block;
        }
        .advanced-grid {
            display: grid;
            grid-template-columns: minmax(220px, 1.1fr) minmax(180px, 1fr) auto;
            gap: 10px;
            align-items: start;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .content-checkboxes {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }
        .checkbox-option {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 42px;
            padding: 0 10px;
            background: #fff;
            border: var(--border-width) solid var(--border-soft);
        }
        .checkbox-option input {
            accent-color: var(--accent-strong);
            margin: 0;
        }
        .checkbox-option label {
            cursor: pointer;
            line-height: 1.2;
            text-transform: none;
            letter-spacing: 0;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--ink);
        }
        .clear-btn-wrapper {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            min-height: 42px;
        }
        label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--muted);
            font-weight: 700;
        }
        input[type="search"],
        select {
            height: 42px;
            padding: 0 12px;
            border: var(--border-width) solid var(--border-soft);
            background: #fff;
            width: 100%;
            font-size: 0.9rem;
        }
        input[type="search"]:focus,
        select:focus {
            outline: 2px solid var(--accent);
            border-color: var(--accent);
        }
        .link-btn {
            min-height: 42px;
            border: var(--border-width) solid var(--border);
            background: #fff;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.7rem;
            cursor: pointer;
            color: var(--ink);
            padding: 8px 12px;
        }
        .link-btn:hover {
            background: var(--bg);
        }
        .location-status {
            font-size: 0.72rem;
            color: var(--muted);
            min-height: 1em;
            margin-top: 4px;
        }
        .distance-label {
            color: var(--muted);
            font-size: 0.78em;
            font-weight: 500;
            margin-left: 6px;
            white-space: nowrap;
        }
        .showtime-details {
            width: 100%;
        }
        .showtime-details summary {
            cursor: pointer;
            color: var(--accent-strong);
            font-size: 0.78rem;
            font-weight: 700;
            padding: 6px 0;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .showtime-details-row {
            margin-top: 6px;
        }

        .view-section {
            border: var(--border-width) solid var(--border);
            background: var(--card);
            padding: 18px 20px;
            box-shadow: var(--shadow-soft);
        }
        .is-hidden {
            display: none;
        }
        .region-block {
            padding: 16px 0;
            border-top: var(--border-width) solid var(--border-soft);
        }
        .region-block:first-child {
            border-top: none;
            padding-top: 0;
        }
        .region-title {
            margin: 0 0 12px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }
        .cinema-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }
        .cinema-card {
            border: var(--border-width) solid var(--border);
            background: #fff;
            padding: 14px;
            text-align: left;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: var(--shadow-soft);
        }
        .cinema-card-title {
            font-weight: 600;
        }
        .cinema-card-meta {
            font-size: 0.8rem;
            color: var(--muted);
        }
        .cinema-showtimes-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            border-bottom: var(--border-width) solid var(--border-soft);
            padding-bottom: 12px;
            margin-bottom: 12px;
        }
        .back-btn {
            border: var(--border-width) solid var(--border);
            background: #fff;
            padding: 8px 12px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
        }
        .cinema-title {
            margin: 0;
            font-size: 1.4rem;
        }
        .cinema-title-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .cinema-meta {
            color: var(--muted);
            font-size: 0.85rem;
        }
        .date-block {
            padding: 14px 0;
            border-top: var(--border-width) solid var(--border-soft);
        }
        .date-block:first-child {
            border-top: none;
            padding-top: 0;
        }
        .date-title {
            margin: 0 0 12px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            font-weight: 600;
            color: var(--accent-strong);
            padding-bottom: 6px;
            border-bottom: 2px solid var(--accent);
        }

            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
            gap: 12px;
            padding: 12px 0;
            border-top: var(--border-width) solid var(--border-soft);
        }
        .cinema-film:first-child {
            border-top: none;
            padding-top: 0;
        }
        .cinema-film-title {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;

        }
        .film-link {
            border: var(--border-width) solid var(--border);
            padding: 4px 8px;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            background: #fff;
        }
        .cinema-map-link {
            margin-top: 2px;
        }
        .cinema-film-meta {
            color: var(--muted);
            font-size: 0.8rem;
            margin-top: 4px;
        }
        .time-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .time-chip {
            border: var(--border-width) solid var(--border);
            padding: 6px 10px;
            font-size: 0.8rem;
            background: #fff;
        }
        .time-chip.is-bookable {
            background: #fff;
            border-color: var(--border);
            color: var(--ink);
        }
        .film-view-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            border-bottom: var(--border-width) solid var(--border-soft);
            padding-bottom: 12px;
            margin-bottom: 12px;
        }

            gap: 16px;

            flex-direction: column;

        }

            margin: 0;

            flex-wrap: wrap;
        }
        .film-meta {
            color: var(--muted);
            font-size: 0.85rem;
        }
        .film-blurb {

            gap: 6px;

            grid-template-columns: 160px minmax(0, 1fr);

            align-items: flex-start;

            font-weight: 600;

            border-top: var(--border-width) solid var(--border-soft);

                grid-template-columns: minmax(0, 1fr);

            .header-left {
                align-items: center;
            }
            .primary-controls {
                grid-template-columns: minmax(0, 1fr) minmax(140px, 0.5fr);
            }
            .search-wrapper {
                grid-column: 1 / -1;
            }
            .sort-wrapper {
                grid-column: 1 / -1;
            }
            .advanced-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .content-checkboxes {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .filter-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .filter-grid-wide {
                grid-template-columns: minmax(0, 1fr);
            }
            .cinema-showtimes-header {

            }
            .film-card {
                grid-template-columns: minmax(0, 1fr);
            }
            .film-poster {

            }
            .showing-row {
                grid-template-columns: minmax(0, 1fr);
            }
            .cinema-film {
                grid-template-columns: minmax(0, 1fr);
            }
        }
        @media (max-width: 640px) {
            body {
                padding: 18px 12px 44px;

                padding: 10px;
            }
            .filters-toggle {
                display: flex;
            }
            .primary-controls,
            .advanced-grid {
                grid-template-columns: minmax(0, 1fr);

            }
            .advanced-filters.is-expanded {
                display: block;
            }
            .search-wrapper {

            }
            .sort-controls {
                grid-template-columns: minmax(0, 1fr);

            .near-me-btn {
                width: 100%;
            }
            .filter-grid {
                grid-template-columns: minmax(0, 1fr);
            }
            .content-checkboxes {
                grid-template-columns: repeat(2, minmax(0, 1fr));

        @media (prefers-reduced-motion: reduce) {

                transition: none !important;
            }
            body::before {
                animation: none;
                opacity: 0.25;
                transform: translate(-50%, -50%) scale(2);
            }
        }

                        map.set(key, {
                            key: key,
                            titleJp: showing.titleJp,
                            titleEn: showing.titleEn,
                            titleDisplay: showing.titleDisplay,
                            year: showing.year,
                            director: showing.director,
                            directorEn: showing.directorEn,
                            runtime: showing.runtime,
                            genres: showing.genres.slice(),
                            rating: showing.rating || 0,
                            overview: showing.overview,
                            posterPath: showing.posterPath,
                            formatTags: new Set(),
                            showings: [],
                            letterboxdUrl: showing.letterboxdUrl
                        });
                    }
                    const film = map.get(key);
                    film.showings.push(showing);
                    if (!film.year && showing.year) film.year = showing.year;
                    if (!film.director && showing.director) film.director = showing.director;
                    if (!film.directorEn && showing.directorEn) film.directorEn = showing.directorEn;
                    if (!film.runtime && showing.runtime) film.runtime = showing.runtime;
                    if (!film.overview && showing.overview) film.overview = showing.overview;
                    if (!film.overviewEn && showing.overviewEn) film.overviewEn = showing.overviewEn;
                    if (!film.posterPath && showing.posterPath) film.posterPath = showing.posterPath;
                    if (!film.titleEn && showing.titleEn) {
                        film.titleEn = showing.titleEn;
                        film.titleDisplay = formatBilingual(film.titleJp, film.titleEn);
                    }
                    if (showing.genres.length && !film.genres.length) film.genres = showing.genres.slice();
                    if (showing.rating > film.rating) film.rating = showing.rating;
                    if (!film.letterboxdUrl && showing.letterboxdUrl) film.letterboxdUrl = showing.letterboxdUrl;
                    showing.formatTags.forEach(function (tag) {
                        film.formatTags.add(tag);
                    });
                });
                const films = Array.from(map.values());
                films.forEach(function (film) {
                    film.showings.sort(compareShowings);
                    film.nextTime = film.showings.length ? timeValue(film.showings[0].dateTime) : Number.POSITIVE_INFINITY;
                    film.formatTags = Array.from(film.formatTags);
                });
                return films;
            };
            function getFiltersSummary() {
                const parts = [];
                if (state.filters.search) parts.push(t("search") + ": \"" + state.filters.search + "\"");
                if (state.filters.date) {
                    parts.push(t("date") + ": " + getDatePresetLabel(state.filters.date));
                }
                if (state.filters.region !== "all") parts.push(t("region") + ": " + getRegionName(state.filters.region));
                const contentParts = [];
                if (state.filters.englishFriendly) contentParts.push(t("contentEnglishFriendly"));
                if (state.filters.docOnly) contentParts.push(t("contentDocumentary"));
                if (state.filters.animationOnly) contentParts.push(t("contentAnimation"));
                if (contentParts.length) parts.push(t("content") + ": " + contentParts.join(" + "));
                if (!parts.length) parts.push(t("noFiltersApplied"));
                return parts.join(" | ");
            }
            function renderCinemaIndex(showings) {
                elements.cinemaIndex.innerHTML = "";
                const cinemasMap = new Map();
                showings.forEach(function (showing) {
                    if (!cinemasMap.has(showing.cinema)) {
                        cinemasMap.set(showing.cinema, { name: showing.cinema, showings: [] });
                    }
                    cinemasMap.get(showing.cinema).showings.push(showing);
                });
                if (!cinemasMap.size) {
                    elements.cinemaIndex.appendChild(createElement("div", "empty-state", t("noCinemas")));
                    return;
                }
                function createCinemaCard(cinema) {
                    const card = createElement("button", "cinema-card");
                    card.type = "button";
                    card.dataset.cinema = cinema.name;
                    card.appendChild(createElement("div", "cinema-card-title", getCinemaDisplayWithDistance(cinema.name)));
                    card.addEventListener("click", function () {
                        state.selectedCinema = cinema.name;
                        writeUrlState(true);
                        render();
                        elements.cinemaTitle.focus({ preventScroll: true });
                        elements.cinemaShowtimes.scrollIntoView({ behavior: "smooth" });
                    });
                    return card;
                }
                function renderCinemaBlock(title, cinemas) {
                    const block = createElement("div", "region-block");
                    block.appendChild(createElement("h2", "region-title", title));
                    const grid = createElement("div", "cinema-grid");
                    cinemas.forEach(function (cinema) {
                        grid.appendChild(createCinemaCard(cinema));
                    });
                    block.appendChild(grid);
                    elements.cinemaIndex.appendChild(block);
                }
                if (state.sort === "nearest" && state.location.active) {
                    renderCinemaBlock(t("nearestCinemas"), Array.from(cinemasMap.values()).sort(compareCinemasForCurrentSort));
                    return;
                }
                let renderedBlocks = 0;
                const renderedCinemaNames = new Set();
                cinemaCategories.forEach(function (category) {
                    const cinemas = category.cinemas.map(function (cinemaName) {
                        const cinema = cinemasMap.get(cinemaName);
                        return cinema ? { name: cinemaName, count: cinema.showings.length, showings: cinema.showings } : { name: cinemaName, count: 0, showings: [] };
                    }).filter(function (cinema) {
                        return cinema.count > 0;
                    }).sort(compareCinemasForCurrentSort);
                    if (!cinemas.length) {
                        return;
                    }
                    renderedBlocks += 1;
                    cinemas.forEach(function (cinema) {
                        renderedCinemaNames.add(cinema.name);
                    });
                    renderCinemaBlock(getRegionName(category.name), cinemas);
                });
                const otherCinemas = Array.from(cinemasMap.values()).filter(function (cinema) {
                    return !renderedCinemaNames.has(cinema.name);
                }).sort(compareCinemasForCurrentSort);
                if (otherCinemas.length) {
                    renderedBlocks += 1;
                    renderCinemaBlock(t("other"), otherCinemas);
                }
                if (!renderedBlocks) {
                    elements.cinemaIndex.appendChild(createElement("div", "empty-state", t("noCinemas")));
                }
            }
            function renderCinemaShowtimes(showings) {
                elements.cinemaShowtimesList.innerHTML = "";
                elements.cinemaTitle.textContent = getCinemaDisplayName(state.selectedCinema);
                elements.cinemaMapLink.href = buildMapsUrl(state.selectedCinema);
                const allCinemaShowings = state.data.filter(function (showing) {
                    return showing.cinema === state.selectedCinema;
                });
                const cinemaWebsite = getCinemaWebsite(state.selectedCinema, allCinemaShowings.length ? allCinemaShowings : showings);
                if (cinemaWebsite) {
                    elements.cinemaSiteLink.href = cinemaWebsite;
                    elements.cinemaSiteLink.classList.remove("is-hidden");
                } else {
                    elements.cinemaSiteLink.classList.add("is-hidden");
                    elements.cinemaSiteLink.removeAttribute("href");
                }
                const range = getDateRange(showings);
                const metaParts = [];
                if (showings.length) metaParts.push(showings.length + " " + t("showings"));
                if (range) metaParts.push(range);
                elements.cinemaMeta.textContent = metaParts.join(" | ");
                if (!showings.length) {
                    elements.cinemaShowtimesList.appendChild(createElement("div", "empty-state", t("noShowings")));
                    return;
                }
                const byDate = new Map();
                showings.forEach(function (showing) {
                    const dateKey = showing.dateText || t("unknownDate");
                    if (!byDate.has(dateKey)) {
                        byDate.set(dateKey, []);
                    }
                    byDate.get(dateKey).push(showing);
                });
                Array.from(byDate.keys()).sort().forEach(function (dateKey) {
                    const group = createElement("div", "date-block");
                    group.appendChild(createElement("h3", "date-title", formatDate(dateKey, true)));
                    const filmMap = new Map();
                    byDate.get(dateKey).forEach(function (showing) {
                        const key = getFilmKey(showing);
                        if (!filmMap.has(key)) {
                            filmMap.set(key, {
                                titleJp: showing.titleJp,
                                titleEn: showing.titleEn,
                                titleDisplay: showing.titleDisplay,
                                year: showing.year,
                                director: showing.director,
                                directorEn: showing.directorEn,
                                runtime: showing.runtime,
                                letterboxdUrl: showing.letterboxdUrl,
                                showings: []
                            });
                        }
                        filmMap.get(key).showings.push(showing);
                    });
                    Array.from(filmMap.values()).forEach(function (film) {
                        film.showings.sort(compareShowings);
                        const row = createElement("div", "cinema-film");
                        const info = createElement("div");
                        const titleRow = createElement("div", "cinema-film-title");
                        titleRow.appendChild(createElement("span", null, getFilmDisplayTitle(film)));
                        if (film.letterboxdUrl) {
                            const letterboxd = createElement("a", "film-link", "Letterboxd");
                            letterboxd.href = film.letterboxdUrl;
                            letterboxd.target = "_blank";
                            letterboxd.rel = "noopener";
                            titleRow.appendChild(letterboxd);
                        }
                        info.appendChild(titleRow);
                        const metaParts = [];
                        if (film.year) metaParts.push(film.year);
                        const filmDirector = getFilmDirector(film);
                        if (filmDirector) metaParts.push(filmDirector);
                        if (film.runtime) metaParts.push(film.runtime + " " + t("min"));
                        if (metaParts.length) {
                            info.appendChild(createElement("div", "cinema-film-meta", metaParts.join(" | ")));
                        }
                        row.appendChild(info);
                        const timeRow = createElement("div", "time-row");
                        appendShowtimeChips(timeRow, film.showings, function (showing) {
                            return showing.showtime || t("tbd");
                        }, function (showing) {
                            return getShowtimeTargetUrl(showing, cinemaWebsite);
                        });
                        row.appendChild(timeRow);
                        group.appendChild(row);
                    });
                    elements.cinemaShowtimesList.appendChild(group);
                });
            }
            function renderCinemaView(showings) {
                elements.cinemaView.classList.remove("is-hidden");
                elements.filmView.classList.add("is-hidden");
                if (state.selectedCinema && !state.data.some(function (showing) { return showing.cinema === state.selectedCinema; })) {
                    state.selectedCinema = "";
                }
                if (state.selectedCinema) {
                    elements.cinemaIndex.classList.add("is-hidden");
                    elements.cinemaShowtimes.classList.remove("is-hidden");
                    const cinemaShowings = showings.filter(function (showing) {
                        return showing.cinema === state.selectedCinema;
                    });
                    renderCinemaShowtimes(cinemaShowings);
                } else {
                    elements.cinemaShowtimes.classList.add("is-hidden");
                    elements.cinemaIndex.classList.remove("is-hidden");
                    renderCinemaIndex(showings);
                }
            }
            function renderFilmList(films, totalShowings) {
                elements.filmResultsCount.textContent = totalShowings + " " + t("showings") + " / " + films.length + " " + t("films");
                elements.filmResultsMeta.textContent = getFiltersSummary();
                const fragment = document.createDocumentFragment();
                films.forEach(function (film) {
                    try {
                        const card = createElement("article", "film-card");
                        const poster = createElement("div", "film-poster", t("posterUnavailable"));
                        const posterUrl = getImageUrl(film.posterPath, "w342");
                        if (posterUrl) {
                            poster.style.backgroundImage = "url(\"" + posterUrl + "\")";
                            poster.style.backgroundSize = "cover";
                            poster.style.backgroundPosition = "center";
                            poster.textContent = "";
                        }
                        card.appendChild(poster);
                        const body = createElement("div", "film-body");
                        body.appendChild(createElement("h3", "film-title", getFilmDisplayTitle(film)));
                        const actions = createElement("div", "film-actions");
                        if (film.letterboxdUrl) {
                            const letterboxd = createElement("a", "film-link", "Letterboxd");
                            letterboxd.href = film.letterboxdUrl;
                            letterboxd.target = "_blank";
                            letterboxd.rel = "noopener";
                            actions.appendChild(letterboxd);
                        }
                        if (actions.childNodes.length) {
                            body.appendChild(actions);
                        }
                        const metaParts = [];
                        if (film.year) metaParts.push(film.year);
                        var filmDirector = getFilmDirector(film);
                        if (filmDirector) metaParts.push(filmDirector);
                        if (film.runtime) metaParts.push(film.runtime + " " + t("min"));
                        if (metaParts.length) {
                            body.appendChild(createElement("div", "film-meta", metaParts.join(" | ")));
                        }
                        var displayOverview = state.lang === "en" ? (film.overviewEn || film.overview) : film.overview;
                        if (displayOverview) {
                            const blurb = createElement("p", "film-blurb", displayOverview);
                            blurb.setAttribute("data-nosnippet", "");
                            body.appendChild(blurb);
                        }
                        if (film.formatTags.length) {
                            const tagRow = createElement("div", "tag-row");
                            film.formatTags.forEach(function (tag) {
                                tagRow.appendChild(createElement("span", "tag", tag));
                            });
                            body.appendChild(tagRow);
                        }
                        const showingsByCinema = new Map();
                        film.showings.forEach(function (showing) {
                            if (!showingsByCinema.has(showing.cinema)) {
                                showingsByCinema.set(showing.cinema, []);
                            }
                            showingsByCinema.get(showing.cinema).push(showing);
                        });
                        Array.from(showingsByCinema.entries()).sort(function (a, b) {
                            return compareCinemaNamesByDistance(a[0], b[0]) || a[0].localeCompare(b[0]);
                        }).forEach(function (entry) {
                            const cinema = entry[0];
                            const showings = entry[1].slice().sort(compareShowings);
                            const cinemaWebsite = getCinemaWebsite(cinema, showings);
                            const row = createElement("div", "showing-row");
                            const cinemaNameCell = createElement("div", "cinema-name");
                            if (cinemaWebsite) {
                                const cinemaNameLink = createElement("a", "cinema-name-link", getCinemaDisplayWithDistance(cinema));
                                cinemaNameLink.href = cinemaWebsite;
                                cinemaNameLink.target = "_blank";
                                cinemaNameLink.rel = "noopener";
                                cinemaNameCell.appendChild(cinemaNameLink);
                            } else {
                                cinemaNameCell.textContent = getCinemaDisplayWithDistance(cinema);
                            }
                            row.appendChild(cinemaNameCell);
                            const timeRow = createElement("div", "time-row");
                            appendShowtimeChips(timeRow, showings, function (showing) {
                                const includeDate = state.filters.date === "all" || state.filters.date === "next-7";
                                return includeDate && showing.dateText
                                    ? formatDate(showing.dateText, false) + " " + (showing.showtime || t("tbd"))
                                    : (showing.showtime || t("tbd"));
                            }, function (showing) {
                                return getShowtimeTargetUrl(showing, cinemaWebsite);
                            });
                            row.appendChild(timeRow);
                            body.appendChild(row);
                        });
                        card.appendChild(body);
                        fragment.appendChild(card);
                    } catch (e) {
                        console.error("Error rendering film:", film, e);
                    }
                });
                elements.filmResultsList.appendChild(fragment);
            }
            function renderFilmView(showings) {
                elements.cinemaView.classList.add("is-hidden");
                elements.filmView.classList.remove("is-hidden");
                elements.filmResultsList.innerHTML = "";
                elements.filmEmpty.classList.add("is-hidden");
                elements.filmResultsMeta.textContent = getFiltersSummary();
                if (!showings.length) {
                    elements.filmResultsCount.textContent = "0 " + t("showings") + " / 0 " + t("films");
                    elements.filmEmpty.classList.remove("is-hidden");
                    return;
                }
                const films = groupByFilm(showings);
                if (state.sort === "nearest" && state.location.active) {
                    films.sort(function (a, b) {
                        return compareDistances(getFilmDistance(a), getFilmDistance(b)) || a.nextTime - b.nextTime;
                    });
                } else if (state.sort === "release-new") {
                    films.sort(function (a, b) {
                        const yearA = parseInt(a.year, 10) || 0;
                        const yearB = parseInt(b.year, 10) || 0;
                        if (yearA !== yearB) return yearB - yearA;
                        return (a.titleDisplay || a.titleJp || a.titleEn || "").localeCompare(b.titleDisplay || b.titleJp || b.titleEn || "");
                    });
                } else if (state.sort === "release-old") {
                    films.sort(function (a, b) {
                        const yearA = parseInt(a.year, 10) || 9999;
                        const yearB = parseInt(b.year, 10) || 9999;
                        if (yearA !== yearB) return yearA - yearB;
                        return (a.titleDisplay || a.titleJp || a.titleEn || "").localeCompare(b.titleDisplay || b.titleJp || b.titleEn || "");
                    });
                } else {
                    // "next-showing" (default): soonest screening first
                    films.sort(function (a, b) {
                        if (a.nextTime !== b.nextTime) return a.nextTime - b.nextTime;
                        return (a.titleDisplay || a.titleJp || a.titleEn || "").localeCompare(b.titleDisplay || b.titleJp || b.titleEn || "");
                    });
                }
                renderFilmList(films, showings.length);
            }
                         function render() {
                const filtered = applyFilters(state.data);
                if (state.view === "film") {
                    renderFilmView(filtered);
                } else {
                    renderCinemaView(filtered);
                }
            }
            function inflateSlim(payload) {
                return payload.showings.map(function (showing) {
                    return Object.assign({}, payload.films[showing.f], showing);
                });
            }
            function fetchJson(url) {
                return fetch(url).then(function (response) {
                    if (!response.ok) {
                        throw new Error("HTTP error " + response.status);
                    }
                    return response.json();
                });
            }
            function fetchShowtimes() {
                fetchJson(slimJsonUrl)
                    .then(function (payload) {
                        if (!payload || !payload.films || !Array.isArray(payload.showings)) {
                            throw new Error("Unexpected slim payload");
                        }
                        return inflateSlim(payload);
                    })
                    .catch(function () {
                        return fetchJson(jsonUrl);
                    })
                    .then(function (data) {
                        if (!Array.isArray(data)) {
                            throw new Error("Unexpected showtimes payload");
                        }
                        const todayText = getJstDateText();
                        state.data = normalizeShowings(data).filter(function (showing) {
                            return showing.dateText >= todayText;
                        });
                        buildFilterOptions(state.data);
                        applySmartDefaultDate();
                        render();
                    })
                    .catch(function () {
                        elements.cinemaIndex.innerHTML = "";
                        elements.cinemaIndex.appendChild(createElement("div", "loading", t("loadError")));
                        elements.filmResultsList.innerHTML = "";
                        elements.filmResultsList.appendChild(createElement("div", "loading", t("loadError")));
                    });
            }
            // Initialize from the URL hash (deep links), then fetch data.
            window.addEventListener("popstate", function () {
                applyUrlState();
            });
            applyUrlState();
            setupIosInstallHint();
            fetchShowtimes();
            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.register("/sw.js");
            }
        });
